<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我太想进步了</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <button class="ghost-button" id="homeButton" type="button" aria-label="返回首页">我太想进步了</button>
        <div class="top-actions">
          <select id="languageSelect" aria-label="语言">
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
          </select>
        </div>
      </header>

      <section class="home-view" id="homeView">
        <p class="eyebrow">弦外之音 / 职场模拟 / 敬酒词</p>
        <h1>我太想进步了</h1>
        <p class="lead">练习听懂话外音、澄清真实需要，也守住自己的边界。从情境练习开始，或看看三种沟通方法会怎样回应。</p>

        <nav class="home-grid" aria-label="功能入口">
          <button class="home-card" type="button" data-route="xianwai">
            <span>01</span>
            <strong>弦外之音</strong>
            <small>高赞评论整理出的善意提醒与话外音案例</small>
          </button>
          <button class="home-card" type="button" data-route="xianwaiRanked">
            <span>02</span>
            <strong>弦外之音排位模式</strong>
            <small>随机出题，按得分评级</small>
          </button>
          <button class="home-card" type="button" data-route="workplace">
            <span>03</span>
            <strong>职场模拟器</strong>
            <small>官场、职场、酒场、商场、家庭场等大分类</small>
          </button>
          <button class="home-card" type="button" data-route="workplaceRanked">
            <span>04</span>
            <strong>职场模拟器排位模式</strong>
            <small>中文按公务员职级，日文按日本职场称号</small>
          </button>
          <button class="home-card" type="button" data-route="toast">
            <span>05</span>
            <strong>敬酒词</strong>
            <small>随机祝福语，也可按不同场所二次筛选</small>
          </button>
        </nav>
        <section class="mentor-section" aria-labelledby="mentorTitle">
          <p class="eyebrow" id="mentorEyebrow">沟通方法实验室</p>
          <h2 id="mentorTitle">同一句话，换三个角度看</h2>
          <p class="lead" id="mentorIntro">先看见事实，再理解可能的需要。选择人物方法，查看情境示范，或下载 Skill 在自己的 AI 中使用。</p>
          <div class="mentor-grid" id="mentorCards"></div>
          <article class="terminal-card mentor-demo">
            <label class="mentor-label"><span id="sceneLabel">选择练习情境</span><select id="mentorScenario"></select></label>
            <p class="question" id="mentorScene"></p>
            <p class="recommendation" id="mentorRecommendation"></p>
            <div id="mentorCompare" class="mentor-comparison"></div>
            <p class="mentor-note" id="mentorDisclaimer">以下是依据公开方法创作的情境示范，不是人物原话、真实经历或本人对你的判断。</p>
          </article>
          <article class="terminal-card mentor-coach">
            <h3 id="coachTitle">把你的情境带进来</h3>
            <label class="mentor-label"><span id="coachLabel">对方原话、你们的关系、你的目标与边界</span><textarea id="coachInput" maxlength="6000" rows="5" placeholder="例如：同事说‘这点小事都不愿帮？’，我想拒绝加班，但仍希望保持合作。"></textarea></label>
            <label class="mentor-label"><span id="methodLabel">选择方法</span><select id="coachMethod"></select></label>
            <button class="ghost-button" id="coachRun" type="button">使用我的 API 分析情境</button>
            <p id="coachStatus" role="status"></p>
          </article>
        </section>
      </section>

      <section class="app-view is-hidden" id="appView" aria-live="polite">
        <div class="view-head">
          <div>
            <p class="eyebrow" id="viewEyebrow">模式</p>
            <h2 id="viewTitle">功能</h2>
          </div>
          <button class="ghost-button" id="backButton" type="button">返回首页</button>
        </div>

        <div class="filters" id="filters">
          <label>
            <span>大分类</span>
            <select id="categorySelect"></select>
          </label>
          <label>
            <span>小分类</span>
            <select id="subcategorySelect"></select>
          </label>
          <button id="randomButton" type="button">随机一题</button>
        </div>

        <article class="terminal-card" id="contentCard"></article>
        <article class="terminal-card result-card is-hidden" id="resultCard"></article>
      </section>
    </main>

    <script src="./data/site-data.js"></script>
    <script src="./app.js"></script>
    <script src="./data/personas.js"></script>
    <script src="./mentors.js"></script>
    <own-ai></own-ai>
    <script type="module" src="./ai/ai-panel.mjs"></script>
  </body>
</html>
